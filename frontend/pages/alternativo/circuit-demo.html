<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuito Digital MIDEC</title>
  <style>
    :root {
      --color-portal: #ed1c24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    .circuit-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circuit-canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>

  <div class="circuit-stage">
    <canvas id="circuit-canvas" class="circuit-canvas"></canvas>
  </div>

  <script src="circuit-animation.js"></script>
</body>
</html>
