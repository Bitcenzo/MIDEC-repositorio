<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MIDEC — Museo Interactivo De El Carmelo" />
    <title>MIDEC — Próximamente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="pre-pantalla.css" />
    <script src="pre-pantalla.js" defer></script>
  </head>
  <body>
    <main class="landing">
      <!-- Composición para escritorio: Red ortogonal de 90° con portales unificados -->
      <svg class="circuit-background circuit-desktop" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
        
        <!-- Líneas de ambiente secundarias -->
        <path class="ambient ambient-one" pathLength="100" d="M -50,300 H 350 V 150 H 850 V 400 H 1200" />
        <path class="ambient ambient-two" pathLength="100" d="M 1200,250 H 1700 V 600 H 1550 V 850 H 1970" />
        <path class="ambient ambient-three" pathLength="100" d="M 150,1100 V 850 H 450 V 950 H 750" />

        <!-- Portal Secundario en Grafito (anclado a ambient-two) -->
        <g class="secondary-route">
          <path class="portal-stroke graphite-portal" pathLength="100" d="M 1550,600 L 1550,525 C 1520,525 1475,490 1475,425 C 1475,360 1510,325 1550,325 C 1590,325 1625,360 1625,425 C 1625,490 1580,525 1550,525" />
        </g>

        <!-- Ruta Principal con Portal Integrado -->
        <g class="active-route">
          <path class="journey" pathLength="100" d="M -50,550 H 250 V 800 H 600 H 1100 V 650 H 1400 V 900 H 1970" />
          <!-- Portal con trazado Bézier exacto (Grosor 50px, Ancho 200px, Vacío 100px) -->
          <path class="portal-stroke" pathLength="100" d="M 600,800 L 600,725 C 570,725 525,690 525,625 C 525,560 560,525 600,525 C 640,525 675,560 675,625 C 675,690 630,725 600,725" />
        </g>

        <!-- Fragmentos discontinuos modulares (50x50 px, separación 50px) -->
        <g class="fragments fragments-one">
          <rect x="850" y="775" width="50" height="50" />
          <rect x="950" y="775" width="50" height="50" />
          <rect x="1050" y="775" width="50" height="50" />
        </g>
        <g class="fragments fragments-two">
          <rect x="450" y="125" width="50" height="50" />
          <rect x="550" y="125" width="50" height="50" />
        </g>
      </svg>

      <!-- Composición para móvil -->
      <svg class="circuit-background circuit-mobile" viewBox="0 0 1000 1778" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
        <path class="ambient ambient-one" pathLength="100" d="M -50,400 H 250 V 200 H 650 V 350 H 1050" />
        <path class="ambient ambient-two" pathLength="100" d="M 1050,1400 H 750 V 1200 H 900 V 900" />
        <path class="ambient ambient-three" pathLength="100" d="M 150,1800 V 1500 H 450 V 1650 H 800" />

        <g class="active-route">
          <path class="journey" pathLength="100" d="M -50,750 H 200 V 1050 H 500 H 800 V 850 H 1050" />
          <path class="portal-stroke" pathLength="100" d="M 500,1050 L 500,975 C 470,975 425,940 425,875 C 425,810 460,775 500,775 C 540,775 575,810 575,875 C 575,940 530,975 500,975" />
        </g>
        
        <g class="fragments fragments-one">
          <rect x="550" y="1025" width="50" height="50" />
          <rect x="650" y="1025" width="50" height="50" />
        </g>
      </svg>

      <section class="hero" aria-labelledby="slogan">
        <svg class="brand" viewBox="364 720 1223 500" role="img" aria-labelledby="brand-title">
          <title id="brand-title">MIDEC — Museo Interactivo De El Carmelo</title>
          <image href="assets/componentes/logo%20horizntal.svg" x="0" y="0" width="1950" height="1950" />
        </svg>
        <h1 id="slogan">Algo grande está por llegar a cambiar la historia de Carmelo como la conocemos....</h1>

        <div class="countdown" aria-live="polite" aria-label="Cuenta regresiva para la apertura">
          <div class="time-unit"><span class="time-value" id="days">00</span><span class="time-label">Días</span></div>
          <div class="time-unit"><span class="time-value" id="hours">00</span><span class="time-label">Horas</span></div>
          <div class="time-unit"><span class="time-value" id="minutes">00</span><span class="time-label">Minutos</span></div>
          <div class="time-unit"><span class="time-value" id="seconds">00</span><span class="time-label">Segundos</span></div>
        </div>

        <a class="instagram-button" href="https://www.instagram.com/midec.uy/" target="_blank" rel="noopener noreferrer">Enterate de todo <span aria-hidden="true">↗</span></a>
      </section>

      <div class="access-area">
        <button class="access-trigger" id="access-trigger" type="button" aria-expanded="false" aria-controls="access-form">Acceder</button>
        <form class="access-form" id="access-form" novalidate>
          <label class="sr-only" for="password">Contraseña de acceso</label>
          <input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Contraseña" />
          <button type="submit">Ingresar</button>
        </form>
      </div>
    </main>
  </body>
</html>
